name: Build Cyanide IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Toolchain check
        run: |
          xcodebuild -version
          clang --version
          make --version | head -1

      - name: Install ldid (required by XPF Makefile)
        run: |
          brew install ldid || true

      - name: Build XPF (libxpf.dylib)
        run: |
          make -C Cyanide/XPF output/ios/libxpf.dylib

      - name: Install xcbeautify (optional)
        run: |
          brew install xcbeautify || true

      - name: Build Cyanide IPA
        run: |
          ./scripts/build.sh SCHEME=Cyanide CONFIG=Debug SDK=iphoneos

      - name: List build products
        run: |
          ls -la build/
          find build -name "*.ipa" -print

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyanide-ipa
          path: |
            build/*.ipa
          if-no-files-found: warn

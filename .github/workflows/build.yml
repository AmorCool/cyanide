name: Build Cyanide IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The private submodule (Cyanide/tweaks/private) is fetched in the
          # next step with SUBMODULE_TOKEN when the secret is available.
          submodules: false

      - name: Fetch private submodule (Cyanide/tweaks/private)
        env:
          SUB_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -n "$SUB_TOKEN" ]; then
            SUB_URL=$(git config -f .gitmodules --get submodule."Cyanide/tweaks/private".url)
            echo "Fetching $SUB_URL with SUBMODULE_TOKEN"
            git clone --depth 1 "https://x-access-token:${SUB_TOKEN}@${SUB_URL#https://}" Cyanide/tweaks/private
          else
            echo "::warning::SUBMODULE_TOKEN secret not set. Private tweaks (Cyanide/tweaks/private, referenced by the Xcode target) are missing; the app build below will fail until the secret is added."
          fi

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Project uses objectVersion 77 / LastUpgradeCheck 2620 (Xcode 26.2)
          xcode-version: '26.2'

      - name: Toolchain check
        run: |
          xcodebuild -version
          clang --version
          make --version | head -1

      - name: Install ldid (required by XPF Makefile)
        run: |
          brew install ldid || true

      - name: Build XPF (libxpf.dylib)
        run: |
          make -C Cyanide/XPF output/ios/libxpf.dylib

      - name: Install xcbeautify (optional)
        run: |
          brew install xcbeautify || true

      - name: Build Cyanide IPA
        run: |
          ./scripts/build.sh SCHEME=Cyanide CONFIG=Debug SDK=iphoneos

      - name: List build products
        run: |
          ls -la build/
          find build -name "*.ipa" -print

      - name: Upload IPA artifact (with commit SHA in name)
        uses: actions/upload-artifact@v4
        with:
          # Embed the short SHA in the artifact name so users downloading by
          # tag/branch can visually confirm the build matches the source.
          name: Cyanide-ipa-${{ github.sha_short }}
          path: |
            build/*.ipa
            build/*.sha256
          if-no-files-found: warn
